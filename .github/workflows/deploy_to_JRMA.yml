name: Auto Deploy to JRMA
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Force Push to JRMA (with retry)
        run: |
          git remote add jrma ${{ secrets.JRMA_REMOTE_URL }}
          for i in 1 2 3 4 5; do
            echo "Attempt $i..."
            git push -f jrma HEAD:deploy && break
            echo "Failed, waiting 15s before retry..."
            sleep 15
          done
